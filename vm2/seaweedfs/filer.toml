# ==============================================================================
# filer.toml — SeaweedFS Filer Configuration (ВМ №2)
# Production Blueprint v5.2
# ==============================================================================
# Назначение: Хранение метаданных файлов (каталоги, имена, атрибуты) в LevelDB.
# Без этого файла filer хранит метаданные в памяти и теряет их при рестарте.
# Кодировка: UTF-8 без BOM, окончания строк LF.
# ==============================================================================

# ==============================================================================
# ХРАНИЛИЩЕ МЕТАДАННЫХ (LevelDB)
# ==============================================================================
# Рекомендуется leveldb2 для production. Обеспечивает сохранение структуры
# каталогов и привязку файлов к volume-серверам.
[leveldb2]
enabled = true
dir = "/data/filerldb2"
createIfMissing = true

# ==============================================================================
# НАСТРОЙКИ S3-ШЛЮЗА (базовые)
# ==============================================================================
# Детальные правила IAM (пользователи, бакеты, права) задаются в s3.json.
# Здесь указываются общие параметры поведения шлюза.
[s3]
enabled = true
# Порт, на котором слушает S3-шлюз (должен совпадать с флагом -port в docker-compose)
port = 8333
# Разрешить аутентификацию через заголовки (обязательно для s3.json)
iam = "s3.json"

# ==============================================================================
# НАСТРОЙКИ ХРАНЕНИЯ ФАЙЛОВ
# ==============================================================================
[storage]
# Репликация по умолчанию для новых файлов, загружаемых через filer/S3.
# 001 = 0 копий в других ЦОД, 0 копий на других стойках, 1 копия на текущей стойке.
# Для single-node ВМ №2 это оптимальный и единственный возможный вариант.
defaultReplicaPlacement = "001"

# Максимальный размер файла для загрузки через HTTP-интерфейс filer (в МБ).
# Для файлов больше этого размера клиенты должны использовать S3 multipart upload.
max_file_name_length = 255
max_mb = 4

# ==============================================================================
# БЕЗОПАСНОСТЬ И ДОСТУП
# ==============================================================================
[gateway]
# Отключаем публичный листинг каталогов через HTTP (доступ только по S3 API)
disable_dir_listing = true

# ==============================================================================
# УВЕДОМЛЕНИЯ (опционально, отключено для упрощения)
# ==============================================================================
[notifications]
# Можно включить Kafka или NATS для событийной реакции на загрузку файлов,
# но на Этапе 1 воркер сам инициирует загрузку и знает о результате.
kafka.enabled = false