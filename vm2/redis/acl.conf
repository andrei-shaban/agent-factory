# ==============================================================================
# redis/acl.conf — ACL для Redis фабрики (ВМ №2)
# Production Blueprint v5.2
# ==============================================================================
# Детальное описание ACL-пользователей и их прав.
# Подключается из redis.conf через: include /usr/local/etc/redis/acl.conf
#
# ВАЖНО:
#   - Перед использованием убедитесь, что в redis.conf убраны встроенные команды
#     "requirepass" и "user agui_svc ...", чтобы избежать дублирования.
#   - Замените placeholder'ы ${REDIS_FACTORY_PASSWORD} и ${REDIS_FACTORY_ACL_PASSWORD}
#     на реальные значения из .env перед запуском.
#   - Или используйте envsubst: envsubst < acl.conf > acl.generated.conf
# ==============================================================================

# ==============================================================================
# ПОЛЬЗОВАТЕЛЬ: default (для Worker и healthcheck)
# ==============================================================================
# Локальный пользователь для подключения из контейнера worker на ВМ №2.
# Использует requirepass из redis.conf (переменная REDIS_FACTORY_PASSWORD).
# Имеет полный доступ ко всем командам, кроме опасных (FLUSH*, DEBUG, CONFIG SET).
#
# Подключение:
#   redis-cli -h redis-factory -p 6379 -a ${REDIS_FACTORY_PASSWORD}
#
# Использование в коде Worker:
#   REDIS_FACTORY_URL=redis://:${REDIS_FACTORY_PASSWORD}@redis-factory:6379
# ==============================================================================

# Пароль для default user (задаётся через requirepass в redis.conf)
# requirepass ${REDIS_FACTORY_PASSWORD}

# Ограничение команд для default user (безопасность)
# Отключаем опасные команды через rename-command в redis.conf:
#   rename-command FLUSHDB ""
#   rename-command FLUSHALL ""
#   rename-command DEBUG ""
#   rename-command CONFIG ""
#   rename-command SHUTDOWN ""
#   rename-command SLAVEOF ""
#   rename-command REPLICAOF ""

# ==============================================================================
# ПОЛЬЗОВАТЕЛЬ: agui_svc (для Gateway с ВМ №1)
# ==============================================================================
# Внешний пользователь для подключения из Gateway (ВМ №1) по TLS.
# Имеет доступ ТОЛЬКО к ключам с префиксом agui:* (очереди, Streams).
# Административные команды отключены (-@admin -@dangerous).
#
# Подключение (с ВМ №1, по TLS):
#   redis-cli -h vm2-redis-factory -p 6380 --tls \
#     --cert /etc/redis/tls/client.crt \
#     --key /etc/redis/tls/client.key \
#     --cacert /etc/redis/tls/ca.crt \
#     --user agui_svc --pass ${REDIS_FACTORY_ACL_PASSWORD}
#
# Использование в коде Gateway:
#   REDIS_FACTORY_URL=rediss://agui_svc:${REDIS_FACTORY_ACL_PASSWORD}@vm2-redis-factory:6379
# ==============================================================================

# Default user: worker and healthcheck authenticate with REDIS_FACTORY_PASSWORD.
user default on >${REDIS_FACTORY_PASSWORD} ~* &* +@all

# Gateway ACL user: keyspaces for the run queue and event streams.
user agui_svc on >${REDIS_FACTORY_ACL_PASSWORD} ~agui:* +@all +@blocking -@admin -@dangerous

# Расшифровка прав:
#   on                  — пользователь активен
#   >${REDIS_FACTORY_ACL_PASSWORD} — пароль из переменной окружения
#   ~agui:*             — доступ только к ключам с префиксом agui:*
#   +@all               — разрешены все команды
#   -@admin             — отключены административные команды (ACL SETUSER, CONFIG SET, и т.д.)
#   -@dangerous         — отключены опасные команды (FLUSH*, DEBUG, KEYS, и т.д.)

# Разрешённые команды для agui_svc (явный список для ясности):
#   +@read              — чтение ключей (GET, MGET, HGET, и т.д.)
#   +@write             — запись ключей (SET, LPUSH, XADD, и т.д.)
#   +@list              — операции со списками (LPUSH, RPUSH, LPOP, RPOP, LRANGE)
#   +@stream            — операции со Streams (XADD, XREAD, XREADGROUP, XRANGE)
#   +@string            — операции со строками (GET, SET, APPEND)
#   +@hash              — операции с хэшами (HGET, HSET, HGETALL)
#   +@set               — операции с множествами (SADD, SMEMBERS)
#   +@sortedset         — операции с сортированными множествами (ZADD, ZRANGE)
#   +@pubsub            — операции с pub/sub (SUBSCRIBE, PUBLISH)
#   +@transaction       — операции с транзакциями (MULTI, EXEC, WATCH)
#   +@scripting         — операции со скриптами (EVAL, EVALSHA)
#   +@connection        — операции подключения (PING, AUTH, SELECT)
#   +@keyspace          — операции с ключами (EXISTS, DEL, EXPIRE, TTL)

# Запрещённые команды для agui_svc:
#   -@admin             — ACL SETUSER, CONFIG SET, CLIENT SETNAME, и т.д.
#   -@dangerous         — FLUSHDB, FLUSHALL, DEBUG, KEYS, SCAN, SHUTDOWN, и т.д.
#   -@slow              — медленные команды (SORT, и т.д.) — опционально
#   -@blocking          — блокирующие команды (BLPOP, BRPOP) — опционально

# ==============================================================================
# ПРИМЕРЫ ИСПОЛЬЗОВАНИЯ
# ==============================================================================

# --- Постановка задачи в очередь (Worker или Gateway) ---
# redis-cli -h redis-factory -p 6379 -a ${REDIS_FACTORY_PASSWORD} \
#   LPUSH agui:tasks:default '{"run_id": "...", "thread_id": "..."}'

# --- Чтение событий из Stream (Gateway для SSE-relay) ---
# redis-cli -h redis-factory -p 6379 -a ${REDIS_FACTORY_PASSWORD} \
#   XREAD BLOCK 5000 COUNT 10 STREAMS agui:stream:{thread_id} 0-0

# --- Ограничение размера Stream (MAXLEN) ---
# redis-cli -h redis-factory -p 6379 -a ${REDIS_FACTORY_PASSWORD} \
#   XADD agui:stream:{thread_id} MAXLEN ~ 10000 * type RUN_STARTED data '{...}'

# --- Установка TTL для ключа (очистка старых тредов) ---
# redis-cli -h redis-factory -p 6379 -a ${REDIS_FACTORY_PASSWORD} \
#   EXPIRE agui:stream:{thread_id} 86400

# --- Проверка прав agui_svc (должен работать) ---
# redis-cli -h redis-factory -p 6379 --user agui_svc --pass ${REDIS_FACTORY_ACL_PASSWORD} \
#   SET agui:test "value"
#   GET agui:test
#   XADD agui:stream:test * data "test"

# --- Проверка прав agui_svc (должен быть отказ) ---
# redis-cli -h redis-factory -p 6379 --user agui_svc --pass ${REDIS_FACTORY_ACL_PASSWORD} \
#   SET other:key "value"              # NOAUTH: ключ не соответствует паттерну ~agui:*
#   FLUSHDB                            # NOPERM: команда отключена через -@dangerous
#   CONFIG SET maxmemory 8gb           # NOPERM: команда отключена через -@admin
#   KEYS *                             # NOPERM: команда отключена через -@dangerous

# ==============================================================================
# ПОЛЬЗОВАТЕЛЬ: monitor (опционально, для мониторинга)
# ==============================================================================
# Пользователь только для чтения метрик и healthcheck.
# Может выполнять INFO, PING, DBSIZE, но не может изменять данные.
#
# Подключение:
#   redis-cli -h redis-factory -p 6379 --user monitor --pass ${REDIS_MONITOR_PASSWORD}
# ==============================================================================

# user monitor on >${REDIS_MONITOR_PASSWORD} ~* +@read +@connection -@admin -@dangerous -@write

# ==============================================================================
# ПОЛЬЗОВАТЕЛЬ: backup (опционально, для бэкапов)
# ==============================================================================
# Пользователь для создания бэкапов (BGSAVE, BGREWRITEAOF).
# Имеет доступ к административным командам бэкапа, но не может изменять данные.
#
# Подключение:
#   redis-cli -h redis-factory -p 6379 --user backup --pass ${REDIS_BACKUP_PASSWORD}
# ==============================================================================

# user backup on >${REDIS_BACKUP_PASSWORD} ~* +@admin +@read -@dangerous -@write

# ==============================================================================
# ПРИМЕЧАНИЯ ПО БЕЗОПАСНОСТИ
# ==============================================================================
#
# 1. Изоляция через префиксы ключей:
#    - agui_svc имеет доступ только к ключам с префиксом agui:*
#    - Worker (default user) имеет доступ ко всем ключам
#    - Это обеспечивает логическую изоляцию очередей фабрики от других данных
#
# 2. Отключение опасных команд:
#    - -@admin отключает команды управления конфигурацией и пользователями
#    - -@dangerous отключает команды, которые могут нарушить работу (FLUSH*, KEYS, DEBUG)
#    - Дополнительно в redis.conf используются rename-command для полного отключения
#
# 3. TLS для внешних подключений:
#    - Gateway (ВМ №1) подключается к Redis (ВМ №2) по TLS
#    - Worker подключается локально без TLS (внутри Docker-сети)
#    - TLS-сертификаты настраиваются в redis.conf (раскомментируйте tls-* директивы)
#
# 4. Мониторинг ACL:
#    - Команда ACL LIST показывает всех пользователей и их права
#    - Команда ACL GETUSER <username> показывает детали конкретного пользователя
#    - Команда ACL WHOAMI показывает текущего пользователя
#
# 5. Ротация паролей:
#    - Для смены пароля agui_svc: ACL SETUSER agui_svc >${NEW_PASSWORD}
#    - Для деактивации пользователя: ACL SETUSER agui_svc off
#    - Для удаления пользователя: ACL DELUSER agui_svc
#
# ==============================================================================
# ИТОГОВАЯ ПРОВЕРКА (опционально, для отладки)
# ==============================================================================
# redis-cli -h redis-factory -p 6379 -a ${REDIS_FACTORY_PASSWORD} ACL LIST
# redis-cli -h redis-factory -p 6379 -a ${REDIS_FACTORY_PASSWORD} ACL GETUSER agui_svc
# redis-cli -h redis-factory -p 6379 -a ${REDIS_FACTORY_PASSWORD} ACL WHOAMI