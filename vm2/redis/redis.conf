# vm2/redis/redis.conf
# ==============================================================================
# redis.conf — Redis фабрики (ВМ №2)
# Production Blueprint v5.2
# ==============================================================================
# Очередь ранов + Streams для реконнекта.
# Локально к воркеру-продюсеру (минимизация round-trip при XADD).
# ACL agui_svc для доступа из Gateway (ВМ №1) по TLS.
# AOF на отдельном томе (отдельном от SeaweedFS и PostgreSQL).
#
# TLS: порт 6379 обслуживает ТОЛЬКО TLS-соединения (внешний, для VM1 Gateway
# и локального Worker через Docker-сеть). Сертификаты монтируются через volume
# из хостовой системы (принцип автономности артефактов, Blueprint §1.8).
# ==============================================================================
# ВАЖНО:
#   - Перед первым запуском замените placeholder'ы на реальные значения из .env:
#     ${REDIS_FACTORY_PASSWORD} → REDIS_FACTORY_PASSWORD
#     ${REDIS_FACTORY_ACL_PASSWORD} → REDIS_FACTORY_ACL_PASSWORD
#   - Или используйте envsubst: envsubst < redis.conf > redis.generated.conf
#   - TLS-сертификаты должны быть положены в ./certs/redis/ перед запуском:
#     redis.crt, redis.key, ca.crt (корпоративный Root CA)
# ==============================================================================

# ==============================================================================
# СЕТЬ И ПОРТ
# ==============================================================================
# Слушаем на всех интерфейсах для доступа из Docker-сети (internal network)
# и с ВМ №1 (через опубликованный порт хоста).
bind 0.0.0.0

# Основной порт — TLS (для внешних подключений Gateway с ВМ №1 и Worker)
# Blueprint §3.1: "Шлюз ВМ №1 подключается по TLS с ACL-пользователем agui_svc"
port 0

# TLS-порт (единственный активный — non-TLS отключён через port 0)
tls-port 6379

# ==============================================================================
# TLS-КОНФИГУРАЦИЯ
# ==============================================================================
# Сертификаты монтируются через volume из ./certs/redis/ (принцип автономности)
tls-cert-file /etc/redis/tls/redis.crt
tls-key-file /etc/redis/tls/redis.key
tls-ca-cert-file /etc/redis/tls/ca.crt

# Аутентификация клиентов: обязательна (и Worker, и Gateway предъявляют пароль)
tls-auth-clients yes

# Минимальная версия TLS (безопасность)
tls-protocols "TLSv1.2 TLSv1.3"

# Предпочитаемые шифры (соответствует nginx на VM1)
tls-ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
tls-ciphersuites "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"

# Prefer server ciphers
tls-prefer-server-ciphers yes

# Таймаут соединения (0 = отключено)
timeout 0

# TCP keepalive (для обнаружения мёртвых соединений, критично для TLS)
tcp-keepalive 300

# TCP backlog
tcp-backlog 511

# ==============================================================================
# ОБЩИЕ НАСТРОЙКИ
# ==============================================================================
# Режим демона (no, так как запускается через Docker)
daemonize no

# Supervision (auto для Docker)
supervised no

# PID-файл (не используется в Docker)
pidfile /var/run/redis_6379.pid

# Уровень логирования (notice для production, debug для отладки)
loglevel notice

# Базовая директория (для AOF и RDB)
dir /data

# ==============================================================================
# АУТЕНТИФИКАЦИЯ И ACL
# ==============================================================================
# Пароль для default user (используется worker и healthcheck)
# Замените ${REDIS_FACTORY_PASSWORD} на реальное значение из .env
requirepass ${REDIS_FACTORY_PASSWORD}

# ACL-пользователь agui_svc для доступа из Gateway (ВМ №1)
# Замените ${REDIS_FACTORY_ACL_PASSWORD} на реальное значение из .env
#
# Права:
#   - Доступ к ключам с префиксом agui:* (очереди, Streams)
#   - Запрет административных команд (FLUSH*, DEBUG, CONFIG SET, и т.д.)
#   - Разрешены команды для очередей и Streams (LPUSH, RPUSH, XADD, XREAD, и т.д.)
user agui_svc on >${REDIS_FACTORY_ACL_PASSWORD} ~agui:* +@all -@admin -@dangerous

# ==============================================================================
# ПЕРСИСТЕНТНОСТЬ — AOF (Append Only File)
# ==============================================================================
# Включаем AOF для durability (очередь задач не должна теряться)
appendonly yes

# Имя файла AOF
appendfilename "appendonly.aof"

# Политика fsync:
#   - always: максимальная durability, но медленнее
#   - everysec: баланс между durability и производительностью (рекомендуется)
#   - no: максимальная производительность, но риск потери данных
appendfsync everysec

# Не перезаписывать AOF при ошибках fsync
no-appendfsync-on-redis no

# Автоматическая перезапись AOF при достижении определённого размера
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ==============================================================================
# ПЕРСИСТЕНТНОСТЬ — RDB (Snapshotting)
# ==============================================================================
# Отключаем RDB (используем только AOF для очереди задач)
save ""

# ==============================================================================
# ПАМЯТЬ И ЛИМИТЫ
# ==============================================================================
# Максимальный объём памяти (из .env: REDIS_MAXMEMORY=4gb)
maxmemory 4gb

# Политика вытеснения:
#   - noeviction: возвращать ошибки при превышении лимита (рекомендуется для очередей)
maxmemory-policy noeviction

# ==============================================================================
# STREAMS (для реконнекта SSE)
# ==============================================================================
# Максимальный размер узла Stream (в байтах)
stream-node-maxbytes 4096

# Максимальное количество записей в узле Stream
stream-node-max-entries 100

# Примечание: MAXLEN и TTL для Streams устанавливаются в коде приложения
# при создании Streams (XADD ... MAXLEN ~ 10000), а не в конфиге Redis.

# ==============================================================================
# ЛОГИРОВАНИЕ
# ==============================================================================
# Медленные запросы (для отладки)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Латентность (для мониторинга)
latency-monitor-threshold 100

# ==============================================================================
# БЕЗОПАСНОСТЬ — ОТКЛЮЧЕНИЕ ОПАСНЫХ КОМАНД
# ==============================================================================
# Отключаем команды, которые могут нарушить работу очереди
# (для default user; для agui_svc уже отключены через ACL)
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command SLAVEOF ""
rename-command REPLICAOF ""

# ==============================================================================
# РЕПЛИКАЦИЯ (не используется, но настроено для безопасности)
# ==============================================================================
# Отключаем репликацию (одиночный инстанс)
replica-serve-stale-data yes
replica-read-only yes

# ==============================================================================
# КЛИЕНТЫ
# ==============================================================================
# Максимальное количество одновременных подключений
maxclients 10000

# ==============================================================================
# LUA-СКРИПТЫ
# ==============================================================================
# Лимит времени выполнения Lua-скриптов (мс)
lua-time-limit 5000

# ==============================================================================
# ДОПОЛНИТЕЛЬНЫЕ НАСТРОЙКИ
# ==============================================================================
# Активировать AOF на лету (если файл повреждён)
aof-load-truncated yes

# Использовать RDB-преамбулу в AOF для ускорения загрузки
aof-use-rdb-preamble yes