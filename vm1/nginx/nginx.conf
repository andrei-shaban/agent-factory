# ==============================================================================
# nginx.conf — ВМ №1: Периметр, шлюзы, observability
# Production Blueprint v5.1
# ==============================================================================
# Кодировка: UTF-8 без BOM, окончания строк LF.
#
# Маршрутизация:
#   factory.corp.example.com/            → SPA (статика, auth_request)
#   factory.corp.example.com/api/        → AG-UI Gateway (SSE без буферизации)
#   factory.corp.example.com/auth/       → Keycloak (IdP, БЕЗ auth_request)
#   factory.corp.example.com/oauth2/     → oauth2-proxy (start/callback/sign_out)
#   langfuse.corp.example.com/           → Langfuse UI (auth_request)
#
# ВАЖНО:
#   1. TLS-сертификат должен содержать SAN на оба имени:
#      factory.corp.example.com, langfuse.corp.example.com
#   2. Keycloak работает в path-based режиме (KC_HTTP_RELATIVE_PATH=/auth),
#      поэтому префикс /auth/ НЕ срезается при проксировании.
#   3. Langfuse отдаётся отдельным vhost'ом (Next.js не поддерживает subpath).
#      Инжест трейсов с ВМ №2 идёт напрямую на ${VM1_HOST_IP}:3000 (см. compose),
#      минуя nginx и oauth2-proxy — аутентификация по API-ключам Langfuse.
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================================================
    # LOG FORMAT
    # ==========================================================================
    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"host":"$host",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ==========================================================================
    # BASIC SETTINGS
    # ==========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;
    server_tokens off;

    # Client body size (загрузка документов)
    client_max_body_size 50m;
    client_body_timeout 60s;

    # Буферы для крупных OIDC-заголовков (JWT, Set-Cookie)
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # ==========================================================================
    # GZIP (не применяется к text/event-stream — SSE не сжимаем)
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml
               image/svg+xml;

    # ==========================================================================
    # UPSTREAMS
    # ==========================================================================
    upstream oauth2_proxy {
        server oauth2-proxy:4180;
        keepalive 32;
    }

    upstream gateway {
        server gateway:8000;
        keepalive 32;
    }

    upstream keycloak {
        server keycloak:8080;
        keepalive 32;
    }

    upstream langfuse {
        server langfuse-web:3000;
        keepalive 32;
    }

    # ==========================================================================
    # SERVER: FACTORY (SPA + API + Keycloak + oauth2)
    # ==========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name factory.corp.example.com;

        # ----------------------------------------------------------------------
        # TLS CONFIGURATION
        # ----------------------------------------------------------------------
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling — только при доступности внутреннего OCSP-респондера УЦ.
        # В air-gap внешние resolver'ы запрещены.
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # resolver <internal-dns-ip> valid=300s;
        # resolver_timeout 5s;

        # ----------------------------------------------------------------------
        # SECURITY HEADERS
        # ----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;

        # ----------------------------------------------------------------------
        # OAUTH2-PROXY: AUTH SUBREQUEST (internal)
        # ----------------------------------------------------------------------
        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2_proxy/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Uri   $request_uri;
            proxy_set_header X-Forwarded-Method $request_method;

            # Обнуление входящих идентификаторов (защита от подделки)
            proxy_set_header X-Forwarded-User   "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Forwarded-Email  "";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------------------
        # OAUTH2-PROXY: LOGIN FLOW (публичный, НЕ internal)
        # /oauth2/start    — редирект в Keycloak
        # /oauth2/callback — обмен code на токен + установка cookie
        # /oauth2/sign_out — выход
        # ----------------------------------------------------------------------
        location /oauth2/ {
            proxy_pass http://oauth2_proxy;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Host              $host;

            proxy_set_header X-Forwarded-User   "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Forwarded-Email  "";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
        }

        # ----------------------------------------------------------------------
        # HEALTHCHECK (без аутентификации)
        # ----------------------------------------------------------------------
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # ----------------------------------------------------------------------
        # KEYCLOAK (IdP) — path-based /auth/, БЕЗ auth_request
        # KC_HTTP_RELATIVE_PATH=/auth → префикс НЕ срезается.
        # ----------------------------------------------------------------------
        location /auth/ {
            proxy_pass http://keycloak;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;

            proxy_set_header X-Forwarded-User   "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Forwarded-Email  "";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_read_timeout 120s;

            # Админ-консоль Keycloak (/auth/admin) рекомендуется дополнительно
            # ограничить по source-IP на межсетевом экране.
        }

        # ----------------------------------------------------------------------
        # 401 для API: отдаём честный 401, чтобы SPA сама сделала редирект
        # на страницу входа (Blueprint §5.4). 302 на XHR ломает fetch/CORS.
        # ----------------------------------------------------------------------
        location @api_unauthorized {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 401 '{"detail":"unauthorized","login":"/oauth2/start"}';
        }

        # ----------------------------------------------------------------------
        # AG-UI GATEWAY (API + SSE)
        # ----------------------------------------------------------------------
        location /api/ {
            auth_request /oauth2/auth;
            error_page 401 = @api_unauthorized;

            # Извлечение идентификаторов из ответа oauth2-proxy
            auth_request_set $auth_user   $upstream_http_x_auth_request_user;
            auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
            auth_request_set $auth_email  $upstream_http_x_auth_request_email;

            # Проброс в Gateway (перезаписывает любые входящие значения)
            proxy_set_header X-Forwarded-User   $auth_user;
            proxy_set_header X-Forwarded-Groups $auth_groups;
            proxy_set_header X-Forwarded-Email  $auth_email;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Host              $host;

            # Реконнект SSE: заголовок Last-Event-ID проходит как есть
            proxy_pass http://gateway;

            # ==================================================================
            # SSE CONFIGURATION (критично для AG-UI, Blueprint §3.4)
            # ==================================================================
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
            add_header X-Accel-Buffering no always;
            chunked_transfer_encoding on;
        }

        # ----------------------------------------------------------------------
        # STATIC SPA (React + AG-UI)
        # ----------------------------------------------------------------------
        location / {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/start;

            auth_request_set $auth_user   $upstream_http_x_auth_request_user;
            auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
            auth_request_set $auth_email  $upstream_http_x_auth_request_email;

            proxy_set_header X-Forwarded-User   $auth_user;
            proxy_set_header X-Forwarded-Groups $auth_groups;
            proxy_set_header X-Forwarded-Email  $auth_email;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            root /usr/share/nginx/html;
            index index.html;

            # SPA routing: все неизвестные пути → index.html
            try_files $uri $uri/ /index.html;

            # Кэширование хешированных ассетов.
            # add_header в вложенном location отменяет наследование,
            # поэтому security-заголовки продублированы явно.
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                access_log off;
                add_header Cache-Control "public, immutable" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "DENY" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            }
        }

        # ----------------------------------------------------------------------
        # DENY SENSITIVE PATHS
        # ----------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|git|htaccess|htpasswd)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ==========================================================================
    # SERVER: LANGFUSE UI (отдельный vhost — Next.js не работает под subpath)
    # Требует SAN langfuse.corp.example.com в том же сертификате.
    # В realm Keycloak добавить redirectUri:
    #   https://langfuse.corp.example.com/oauth2/callback
    # ==========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name langfuse.corp.example.com;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # OAUTH2-PROXY (те же локации, но в рамках своего server-блока)
        # ----------------------------------------------------------------------
        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2_proxy/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Uri   $request_uri;

            proxy_set_header X-Forwarded-User   "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Forwarded-Email  "";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /oauth2/ {
            proxy_pass http://oauth2_proxy;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Host              $host;

            proxy_set_header X-Forwarded-User   "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Forwarded-Email  "";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # ----------------------------------------------------------------------
        # LANGFUSE UI + API (NextAuth живёт под собственным доменом)
        # ----------------------------------------------------------------------
        location / {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/start;

            auth_request_set $auth_user   $upstream_http_x_auth_request_user;
            auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
            auth_request_set $auth_email  $upstream_http_x_auth_request_email;

            proxy_set_header X-Forwarded-User   $auth_user;
            proxy_set_header X-Forwarded-Groups $auth_groups;
            proxy_set_header X-Forwarded-Email  $auth_email;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Host              $host;

            proxy_pass http://langfuse;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_read_timeout 300s;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ==========================================================================
    # HTTP → HTTPS REDIRECT (+ healthcheck для docker/балансировщика)
    # ==========================================================================
    server {
        listen 80 default_server;
        server_name factory.corp.example.com langfuse.corp.example.com;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}