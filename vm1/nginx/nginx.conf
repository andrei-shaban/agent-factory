# nginx.conf — ВМ №1: Периметр, шлюзы, observability
# Production Blueprint v5.1

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================================
    # LOG FORMAT
    # ============================================================================
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';

    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ============================================================================
    # BASIC SETTINGS
    # ============================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client body size (для загрузки документов)
    client_max_body_size 50m;

    # ============================================================================
    # GZIP (только для статики, не для SSE)
    # ============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml
               image/svg+xml;

    # ============================================================================
    # UPSTREAMS
    # ============================================================================
    upstream oauth2_proxy {
        server oauth2-proxy:4180;
        keepalive 32;
    }

    upstream gateway {
        server gateway:8000;
        keepalive 32;
    }

    upstream langfuse {
        server langfuse-web:3000;
        keepalive 32;
    }

    # ============================================================================
    # HTTPS SERVER
    # ============================================================================
    server {
        listen 443 ssl http2;
        server_name factory.corp.example.com;

        # ------------------------------------------------------------------------
        # TLS CONFIGURATION
        # ------------------------------------------------------------------------
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Session cache (для TLS resume)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (если есть доступ к CA)
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # resolver 8.8.8.8 8.8.4.4 valid=300s;
        # resolver_timeout 5s;

        # ------------------------------------------------------------------------
        # SECURITY HEADERS (на уровне server для наследования)
        # ------------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;

        # ------------------------------------------------------------------------
        # AUTH REQUEST (делегирование oauth2-proxy)
        # ------------------------------------------------------------------------
        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2_proxy/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /oauth2/start {
            internal;
            proxy_pass http://oauth2_proxy/oauth2/start;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /oauth2/sign_out {
            internal;
            proxy_pass http://oauth2_proxy/oauth2/sign_out;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ------------------------------------------------------------------------
        # HEALTHCHECK (без аутентификации)
        # ------------------------------------------------------------------------
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # ------------------------------------------------------------------------
        # STATIC SPA (React + AG-UI)
        # ------------------------------------------------------------------------
        location / {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/start;

            # Извлечение заголовков из oauth2-proxy
            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;

            # Проброс в backend (для логов и аудита)
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Groups $auth_groups;
            proxy_set_header X-Forwarded-Email $auth_email;

            # Обнуление входящих заголовков (защита от подделки)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            root /usr/share/nginx/html;
            index index.html;

            # SPA routing: все запросы → index.html
            try_files $uri $uri/ /index.html;

            # Кэширование статики
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ------------------------------------------------------------------------
        # AG-UI GATEWAY (API + SSE)
        # ------------------------------------------------------------------------
        location /api/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/start;

            # Извлечение заголовков из oauth2-proxy
            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;

            # Проброс в Gateway
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Groups $auth_groups;
            proxy_set_header X-Forwarded-Email $auth_email;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;

            proxy_pass http://gateway;

            # ====================================================================
            # SSE CONFIGURATION (критично для AG-UI)
            # ====================================================================
            proxy_buffering off;              # Отключение буферизации
            proxy_cache off;                  # Отключение кэширования
            proxy_http_version 1.1;           # HTTP/1.1 для keep-alive
            proxy_set_header Connection "";   # Удаление Connection: close
            proxy_read_timeout 3600s;         # 1 час для длинных SSE-сессий
            proxy_send_timeout 3600s;         # 1 час
            add_header X-Accel-Buffering no;  # Явное указание не буферизировать

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # ------------------------------------------------------------------------
        # LANGFUSE UI (observability)
        # ------------------------------------------------------------------------
        location /langfuse/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/start;

            # Извлечение заголовков из oauth2-proxy
            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;

            # Проброс в Langfuse
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Groups $auth_groups;
            proxy_set_header X-Forwarded-Email $auth_email;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;

            # Удаление префикса /langfuse/ перед проксированием
            rewrite ^/langfuse/(.*) /$1 break;
            proxy_pass http://langfuse;

            # Для Langfuse UI можно включить буферизацию
            proxy_buffering on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ------------------------------------------------------------------------
        # DENY SENSITIVE PATHS
        # ------------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|git|htaccess|htpasswd)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ============================================================================
    # HTTP → HTTPS REDIRECT
    # ============================================================================
    server {
        listen 80;
        server_name factory.corp.example.com;

        # Healthcheck (для балансировщиков)
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Все остальное → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}