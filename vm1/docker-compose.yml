# ==============================================================================
# docker-compose.yml — ВМ №1: Периметр, шлюзы, observability, зеркала
# Production Blueprint v5.2.1
# ==============================================================================
#
# Состав:
#   - nginx (ingress / SSE-proxy)
#   - oauth2-proxy + Keycloak (OIDC / LDAP-федерация)
#   - PostgreSQL — Auth & Observability (только базу Keycloak и Langfuse)
#   - Redis — Langfuse (noeviction, ACL langfuse_svc)
#   - Langfuse web + worker (v4) + ClickHouse (26.8 LTS)
#   - PyPI mirror (доступ только с ВМ №2)
#   - AG-UI Gateway (FastAPI)
#
# ------------------------------------------------------------------------------
# СЕРТИФИКАТЫ — централизованное хранилище D:\agent-factory\certs\
# ------------------------------------------------------------------------------
#   ../certs/ca/corp-ca.crt              — корпоративный Root CA (публичный)
#   ../certs/vm1/nginx/server.crt|.key   — TLS nginx (SAN на оба домена)
#
# ==============================================================================
# ИНИЦИАЛИЗАЦИЯ БД — ВАЖНО
# ==============================================================================
# Расширение .sh в целевом пути ОБЯЗАТЕЛЬНО: официальный entrypoint postgres
# исполняет *.sh как bash-скрипт с доступом к переменным окружения
# (KEYCLOAK_DB_, LANGFUSE_DB_). Файл *.sql исполняется как SQL и упадёт.
# Скрипты выполняются ТОЛЬКО при пустом PGDATA. Для переинициализации:
#   docker compose down
#   docker volume rm factory-vm1_postgres-auth-data
#   docker compose up -d
#
# ==============================================================================
# ПОДГОТОВКА ПЕРЕД ПЕРВЫМ СТАРТОМ
# ==============================================================================
#   1. cp .env.example .env && python init_project.py
#   2. Проверить ../certs/ (наличие и валидность сертификатов)
#   3. Положить статику SPA в spa/dist/
#   4. Задать VM1_HOST_IP и VM2_HOST_IP в .env
# ==============================================================================

name: factory-vm1

services:
  # ============================================================================
  # INGRESS / SSE-PROXY
  # ============================================================================
  nginx:
    image: nginx:1.31.9-alpine
    container_name: vm1-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS из централизованного хранилища (SAN: factory. + langfuse.)
      - ../certs/vm1/nginx/server.crt:/etc/nginx/certs/server.crt:ro
      - ../certs/vm1/nginx/server.key:/etc/nginx/certs/server.key:ro
      # Серверный сертификат OTel-ingest и CA для проверки клиентского сертификата VM2
      - ../certs/vm1/nginx/langfuse-ingest.crt:/etc/nginx/certs/langfuse-ingest.crt:ro
      - ../certs/vm1/nginx/langfuse-ingest.key:/etc/nginx/certs/langfuse-ingest.key:ro
      - ../certs/ca/corp-ca.crt:/etc/nginx/certs/ca.crt:ro
      - ./spa/dist:/usr/share/nginx/html:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    depends_on:
      oauth2-proxy:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      frontend:
        aliases:
          - factory.corp.example.com
          - langfuse.corp.example.com
      cross-vm:
        aliases:
          - factory.corp.example.com
          - langfuse.corp.example.com
          - langfuse-ingest.corp.example.com
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # AUTH-PROXY (oauth2-proxy + Keycloak OIDC)
  #
  # Секреты передаются через environment (нативная поддержка OAUTH2_PROXY_*),
  # а НЕ через ${...} в cfg — oauth2-proxy не раскрывает переменные в конфиге.
  # ============================================================================
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: vm1-oauth2-proxy
    restart: unless-stopped
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
      - --provider-ca-file=/etc/ssl/certs/corp-ca.crt
      - --insecure-oidc-skip-issuer-verification
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/auth/realms/factory
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      # Корпоративный Root CA из централизованного хранилища
      - ../certs/ca/corp-ca.crt:/etc/ssl/certs/corp-ca.crt:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - frontend
    # Образ distroless — healthcheck изнутри недоступен.
    # Проверка: docker exec vm1-nginx wget -qO- http://oauth2-proxy:4180/ping
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # IdP / LDAP-FEDERATION (Keycloak)
  #
  # Path-based: KC_HTTP_RELATIVE_PATH=/auth, публично через nginx /auth/
  # Realm импортируется из rendered/ при первом запуске (--import-realm).
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vm1-keycloak
    restart: unless-stopped
    command:
      - start
      - --proxy-headers=xforwarded
      - --hostname-strict=false
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-auth:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      # F1: Keycloak 26 требует KC_BOOTSTRAP_ADMIN_* вместо KEYCLOAK_ADMIN*
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      # Отрендеренный realm (подстановка секрета клиента — init_project.py)
      - ./rendered/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - frontend
      - internal
    healthcheck:
      # Проверяем доступность HTTP listener; /health/ready на management-порту здесь отвечает 404.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # POSTGRESQL — AUTH & OBSERVABILITY (Keycloak + Langfuse DB)
  #
  # Доступен ТОЛЬКО контейнерам внутри ВМ №1 (порт 5432 на хост не публикуется).
  # БД "factory" здесь НЕ создаётся — реестр ранов живёт на ВМ №2 (Blueprint §3.1).
  # Debian-база (bookworm) вместо alpine: поддержка локали C.UTF-8.
  # ============================================================================
  postgres-auth:
    image: postgres:17-bookworm
    container_name: vm1-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: postgres
      # Креды для init-скрипта (исполняется с доступом к этим переменным)
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      TZ: ${TZ:-Asia/Yekaterinburg}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      # Bash-скрипт: целевое расширение .sh обязательно для исполнения как bash
      - ./init-db/01-create-databases.sql.sh:/docker-entrypoint-initdb.d/01-create-databases.sql.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # REDIS — LANGFUSE (инжест, BullMQ)
  #
  # noeviction — требование BullMQ.
  # ACL langfuse_svc: паттерн ~* (BullMQ использует bull:, LOCK: и др. префиксы).
  # ============================================================================
  redis-langfuse:
    image: redis:8-alpine
    container_name: vm1-redis-langfuse
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --maxmemory
      - 2gb
      - --requirepass
      - ${REDIS_LANGFUSE_PASSWORD}
      - --user
      - langfuse_svc
      - "on"
      - ">${REDIS_LANGFUSE_ACL_PASSWORD}"
      - "~*"
      - "+@all"
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - redis-langfuse-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_LANGFUSE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # LANGFUSE WEB (observability UI/API) — v4.82+
  #
  # UI: через nginx (langfuse.corp.example.com, отдельный vhost).
  # Инжест: порт 3000 на VM1_HOST_IP для воркера ВМ №2 (ограничить на МЭ).
  # ============================================================================
  langfuse-web:
    image: langfuse/langfuse:4
    container_name: vm1-langfuse-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD_URLENCODED}@postgres-auth:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      HOSTNAME: 0.0.0.0
      NODE_EXTRA_CA_CERTS: /etc/certs/corp-ca.crt
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: redis://langfuse_svc:${REDIS_LANGFUSE_ACL_PASSWORD_URLENCODED}@redis-langfuse:6379
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # F2: OIDC-федерация через Keycloak (без паролей Langfuse)
      AUTH_KEYCLOAK_CLIENT_ID: ${AUTH_KEYCLOAK_CLIENT_ID:-langfuse-ui}
      AUTH_KEYCLOAK_CLIENT_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: https://langfuse.corp.example.com
      AUTH_KEYCLOAK_ALLOW_ACCOUNT_LINKING: "true"
      AUTH_DISABLE_USERNAME_PASSWORD: "true"
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      - "${VM1_HOST_IP}:3000:3000"
    depends_on:
      postgres-auth:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis-langfuse:
        condition: service_healthy
    networks:
      - frontend
      - internal
      - cross-vm
    volumes:
      - ../certs/ca/corp-ca.crt:/etc/certs/corp-ca.crt:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # LANGFUSE WORKER (инжест трейсов) — v4.82+
  # ============================================================================
  langfuse-worker:
    image: langfuse/langfuse-worker:4
    container_name: vm1-langfuse-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD_URLENCODED}@postgres-auth:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: redis://langfuse_svc:${REDIS_LANGFUSE_ACL_PASSWORD_URLENCODED}@redis-langfuse:6379
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      TELEMETRY_ENABLED: "false"
      TZ: ${TZ:-Asia/Yekaterinburg}
    depends_on:
      postgres-auth:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis-langfuse:
        condition: service_healthy
    networks:
      - internal
      - cross-vm
    volumes:
      - ../certs/ca/corp-ca.crt:/etc/certs/corp-ca.crt:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # CLICKHOUSE (трейсы и observations Langfuse) — 26.8 LTS
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    container_name: vm1-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # PYPI MIRROR (зеркало wheels для песочниц ВМ №2)
  #
  # Порт 8080 на VM1_HOST_IP — доступ только с ВМ №2 (ограничить на МЭ).
  # ============================================================================
  pypiserver:
    image: pypiserver/pypiserver:v2.4.3
    container_name: vm1-pypiserver
    restart: unless-stopped
    command:
      - run
      - --host=0.0.0.0
      - --port=8080
      - --overwrite
      - /data/packages
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      - "${VM1_HOST_IP}:8080:8080"
    volumes:
      - ./pypiserver/packages:/data/packages
    networks:
      - internal
      - cross-vm
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # AG-UI GATEWAY (FastAPI)
  #
  # Только сеть frontend: доступ к redis-langfuse / clickhouse / postgres-auth
  # (internal) ему НЕ нужен — изоляция по Blueprint §3.1.
  # Корпоративный Root CA монтируется через bind mount (не вшит в образ).
  # ============================================================================
  gateway:
    image: factory/gateway:1.0.0
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: vm1-gateway
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Межсерверные маршруты к ВМ №2 (Blueprint §4)
      REDIS_FACTORY_URL: rediss://agui_svc:${REDIS_FACTORY_ACL_PASSWORD_URLENCODED}@redis-factory:6379/0?ssl_ca_certs=/run/certs/ca.crt
      REDIS_FACTORY_TLS: "true"
      # Проверяем CA и hostname vm2-postgres из SAN сертификата VM2.
      POSTGRES_RUNTIME_URL: postgresql://${GATEWAY_DB_USER}:${GATEWAY_DB_PASSWORD_URLENCODED}@vm2-postgres:5432/factory?sslmode=verify-full&sslrootcert=/run/certs/ca.crt
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
      SSL_CERT_FILE: /run/certs/ca.crt
      REQUESTS_CA_BUNDLE: /run/certs/ca.crt
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      # Конфигурация/код Gateway и Root CA поставляются отдельно от образа.
      - ./gateway/app:/app/app:ro
      - ../certs/ca/corp-ca.crt:/run/certs/ca.crt:ro
    depends_on:
      langfuse-web:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
    networks:
      - frontend
      - cross-vm
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health | grep -q healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  frontend:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  cross-vm:
    name: factory-cross-vm
    external: true

# ==============================================================================
# VOLUMES — только данные. Конфиги и сертификаты — через bind mounts.
# ==============================================================================
volumes:
  postgres-auth-data:
  redis-langfuse-data:
  clickhouse-data:
  clickhouse-logs:
  nginx-cache:
  nginx-logs:
