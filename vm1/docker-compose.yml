# vm1/docker-compose.yml
# ==============================================================================
# docker-compose.yml — ВМ №1: Периметр, шлюзы, observability, зеркала
# ==============================================================================
#
# Состав:
#   - nginx (ingress / SSE-proxy)
#   - oauth2-proxy + Keycloak (OIDC / LDAP-федерация)
#   - PostgreSQL — Auth & Observability (только базы Keycloak и Langfuse)
#   - Redis — Langfuse (noeviction, ACL langfuse_svc)
#   - Langfuse web + worker (v4) + ClickHouse (26.8 LTS)
#   - PyPI mirror (доступ только с ВМ №2)
#   - AG-UI Gateway (FastAPI)
#
# ВАЖНО перед первым стартом:
#   1. Скопировать .env.example в .env и заполнить значения.
#   2. Запустить ./render-configs.sh → создаст rendered/realm-export.json.
#   3. Поместить корпоративный TLS-сертификат в nginx/certs/
#      (SAN должен покрывать: factory.corp.example.com, langfuse.corp.example.com).
#   4. Поместить статическую сборку SPA в spa/dist/.
#   5. Задать VM1_HOST_IP и VM2_HOST_IP в .env.
#
# ==============================================================================
name: factory-vm1
services:
  # ============================================================================
  # INGRESS / SSE-PROXY
  # ============================================================================
  nginx:
    image: nginx:1.31.9-alpine  # pin digest from mirror
    container_name: vm1-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    command: ["nginx", "-c", "/etc/nginx-runtime/nginx.conf", "-g", "daemon off;"]
    volumes:
      - nginx-runtime-config:/etc/nginx-runtime:ro
      - nginx-tls:/etc/nginx/certs:ro
      - spa-dist:/usr/share/nginx/html:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    depends_on:
      oauth2-proxy:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      frontend:
        aliases:
          - langfuse.corp.example.com
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # AUTH-PROXY (oauth2-proxy + Keycloak OIDC)
  # Секреты передаются через environment (OAUTH2_PROXY_* — нативная поддержка),
  # а НЕ через ${...} в cfg — oauth2-proxy не раскрывает переменные в конфиге.
  # ============================================================================
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0  # pin digest from mirror
    container_name: vm1-oauth2-proxy
    restart: unless-stopped
    command:
      - --config=/etc/oauth2-proxy-config/oauth2-proxy.cfg
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --provider-ca-file=/etc/oauth2-proxy-certs/ca.crt
      - --insecure-oidc-skip-issuer-verification
    environment:
      # Нативные переменные окружения (имеют приоритет над cfg)
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/auth/realms/factory
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - oauth2-proxy-config:/etc/oauth2-proxy-config:ro
      - nginx-tls:/etc/oauth2-proxy-certs:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - frontend
    # OAuth2-proxy image is distroless; probe it from host/network diagnostics.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # IdP / LDAP-FEDERATION (Keycloak)
  # Path-based: KC_HTTP_RELATIVE_PATH=/auth, публично через nginx /auth/
  # Realm импортируется из rendered/ при первом запуске (--import-realm).
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0  # pin digest from mirror
    container_name: vm1-keycloak
    restart: unless-stopped
    command:
      - start
      - --proxy-headers=xforwarded
      - --hostname-strict=false
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-auth:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}  # https://factory.corp.example.com/auth
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      # Отрендеренный realm (см. render-configs.sh): подстановка секрета клиента
      - keycloak-import:/opt/keycloak/data/import:ro
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      frontend:
        aliases:
          - factory.corp.example.com
      internal: {}
    healthcheck:
      # Health endpoint Keycloak доступен на management-порту 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # POSTGRESQL — AUTH & OBSERVABILITY (Keycloak + Langfuse DB)
  # Доступен ТОЛЬКО контейнерам внутри ВМ №1. БД "factory" НЕ создаётся здесь
  # (реестр ранов живёт на ВМ №2 — см. Blueprint §3.1).
  # Пароли подставляются в init-скрипт (.sql.sh) через эти переменные окружения.
  # ============================================================================
  postgres-auth:
    image: postgres:17-bookworm  # Debian base includes locale support
    container_name: vm1-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      # POSTGRES_USER используется официальным init-entrypoint и нашим init-скриптом.
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_DB: postgres
      # Креды для init-скрипта (исполняется с доступом к этим переменным)
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      TZ: ${TZ:-Asia/Yekaterinburg}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      # Официальный образ исполняет *.sh из этого каталога при первой инициализации PGDATA.
      - postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # REDIS — LANGFUSE (инжест, BullMQ)
  # noeviction, ACL langfuse_svc, доступен только контейнерам Langfuse
  # ============================================================================
  redis-langfuse:
    image: redis:8-alpine  # pin digest from mirror
    container_name: vm1-redis-langfuse
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --maxmemory
      - 2gb
      - --requirepass
      - ${REDIS_LANGFUSE_PASSWORD}
      - --user
      - langfuse_svc
      - "on"
      - ">${REDIS_LANGFUSE_ACL_PASSWORD}"
      - "~langfuse:*"
      - "~bull:*"
      - "~LOCK:*"
      - "+@all"
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - redis-langfuse-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_LANGFUSE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # LANGFUSE WEB (observability UI/API) — v4
  # Порт 3000 не публикуется; внешний UI и ingest идут через отдельные vhost Nginx.
  # ============================================================================
  langfuse-web:
    image: langfuse/langfuse:4  # v4.82+, pin digest from mirror
    container_name: vm1-langfuse-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD_URLENCODED}@postgres-auth:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}  # https://langfuse.corp.example.com
      HOSTNAME: 0.0.0.0
      SALT: ${LANGFUSE_SALT}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD_URLENCODED}@clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: redis://langfuse_svc:${REDIS_LANGFUSE_ACL_PASSWORD_URLENCODED}@redis-langfuse:6379
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://${VM2_HOST_IP}:8333
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      TZ: ${TZ:-Asia/Yekaterinburg}
    depends_on:
      postgres-auth:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis-langfuse:
        condition: service_healthy
    networks:
      - frontend
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # LANGFUSE WORKER (инжест трейсов) — v4
  # ============================================================================
  langfuse-worker:
    image: langfuse/langfuse-worker:4  # v4.82+, pin digest from mirror
    container_name: vm1-langfuse-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD_URLENCODED}@postgres-auth:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD_URLENCODED}@clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: redis://langfuse_svc:${REDIS_LANGFUSE_ACL_PASSWORD_URLENCODED}@redis-langfuse:6379
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://${VM2_HOST_IP}:8333
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      TELEMETRY_ENABLED: "false"
      TZ: ${TZ:-Asia/Yekaterinburg}
    depends_on:
      postgres-auth:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis-langfuse:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # CLICKHOUSE (трейсы и observations Langfuse) — 26.8 LTS (мин. 25.12)
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine  # pin digest from mirror
    container_name: vm1-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # PYPI MIRROR (зеркало wheels для песочниц)
  # Порт 8080 публикуется на VM1_HOST_IP — доступ только с ВМ №2 (по МЭ).
  # ============================================================================
  pypiserver:
    image: pypiserver/pypiserver:v2.4.3  # сверить тег с инвентаризацией зеркала; в проде — pin по digest (SBOM)
    container_name: vm1-pypiserver
    restart: unless-stopped
    command:
      - run
      - --host=0.0.0.0
      - --port=8080
      - --overwrite
      - /data/packages
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      # Загрузка wheels воркером ВМ №2 (маршрут ВМ №2 → ВМ №1:8080, по МЭ)
      - "${VM1_HOST_IP}:8080:8080"
    volumes:
      - pypiserver-packages:/data/packages
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

  # ============================================================================
  # AG-UI GATEWAY (FastAPI)
  # Только сеть frontend: доступ к redis-langfuse/clickhouse/postgres-auth
  # (internal) ему НЕ нужен — изоляция по Blueprint §3.1.
  #
  # Корпоративный Root CA монтируется через volume (не вшит в образ).
  # Переменные SSL_CERT_FILE и REQUESTS_CA_BUNDLE указывают напрямую на смонтированный файл.
  # ============================================================================
  gateway:
    image: factory/gateway:latest
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: vm1-gateway
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Межсерверные маршруты к ВМ №2 (Blueprint §4)
      # Адрес ВМ №2 задаётся переменной VM2_HOST_IP в .env
      REDIS_FACTORY_URL: rediss://agui_svc:${REDIS_FACTORY_ACL_PASSWORD_URLENCODED}@${VM2_HOST_IP}:6379
      REDIS_FACTORY_TLS: "true"
      POSTGRES_RUNTIME_URL: postgresql://${GATEWAY_DB_USER}:${GATEWAY_DB_PASSWORD_URLENCODED}@${VM2_HOST_IP}:5432/factory?sslmode=require
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
      # Указываем напрямую на смонтированный CA-файл
      SSL_CERT_FILE: /run/certs/ca.crt
      REQUESTS_CA_BUNDLE: /run/certs/ca.crt
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      # Единый каталог сертификатов VM1; ca.crt служит доверенным корнем для Gateway.
      - gateway-ca:/run/certs:ro
    depends_on:
      langfuse-web:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  frontend:
    driver: bridge
  internal:
    driver: bridge
    internal: true

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  nginx-runtime-config:
  nginx-tls:
  spa-dist:
  oauth2-proxy-config:
  keycloak-import:
  postgres-init:
  gateway-ca:
  pypiserver-packages:
  postgres-auth-data:
  redis-langfuse-data:
  clickhouse-data:
  clickhouse-logs:
  nginx-cache:
  nginx-logs: