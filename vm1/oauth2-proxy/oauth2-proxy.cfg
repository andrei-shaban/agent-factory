# ==============================================================================
# oauth2-proxy configuration
# Production Blueprint v5.2 — ВМ №1
# Провайдер: Keycloak OIDC
# ==============================================================================
# Кодировка: UTF-8 без BOM, окончания строк LF.
#
# ВАЖНО: все секреты и чувствительные значения НЕ указываются в этом файле.
# Они передаются через переменные окружения контейнера (см. docker-compose):
#   OAUTH2_PROXY_OIDC_ISSUER_URL
#   OAUTH2_PROXY_CLIENT_ID
#   OAUTH2_PROXY_CLIENT_SECRET
#   OAUTH2_PROXY_COOKIE_SECRET
# oauth2-proxy читает переменные с префиксом OAUTH2_PROXY_ автоматически.
# Значения вида ${...} внутри cfg НЕ раскрываются и ломают аутентификацию.
# ==============================================================================

# ------------------------------------------------------------------------------
# Базовые параметры
# ------------------------------------------------------------------------------
http_address        = "0.0.0.0:4180"
metrics_address     = "0.0.0.0:9090"

# ------------------------------------------------------------------------------
# Провайдер: Keycloak OIDC
# Issuer URL берётся из переменной окружения OAUTH2_PROXY_OIDC_ISSUER_URL,
# например: https://factory.corp.example.com/auth/realms/factory
# ------------------------------------------------------------------------------
provider            = "keycloak-oidc"
code_challenge_method = "S256"

# ------------------------------------------------------------------------------
# OIDC-клиент (регистрируется в Keycloak realm "factory")
# client_id / client_secret берутся из переменных окружения.
# ------------------------------------------------------------------------------

# Разрешённые email-домены ("*" — любые, т.к. аутентификация через корпоративный
# Keycloak + LDAP, а не по домену почты)
email_domains       = ["*"]

# ------------------------------------------------------------------------------
# Cookie
# Секрет подписи берётся из переменной окружения OAUTH2_PROXY_COOKIE_SECRET.
# ------------------------------------------------------------------------------
cookie_name         = "_oauth2_proxy"
cookie_secure       = true
cookie_httponly     = true
cookie_samesite     = "lax"
cookie_expire       = "24h"
cookie_refresh      = "1h"
cookie_csrf_per_request = true

# ------------------------------------------------------------------------------
# Заголовки (проброс в backend через nginx auth_request)
# ------------------------------------------------------------------------------
# Устанавливает X-Auth-Request-User / X-Auth-Request-Email / X-Auth-Request-Groups
# для извлечения nginx через auth_request_set (Blueprint §3.4).
set_xauthrequest    = true

# Не пробрасываем токен/authorization header в backend —
# аутентификация уже выполнена на уровне nginx + Keycloak.
set_authorization_header   = false
pass_access_token          = false
pass_authorization_header  = false

# Заголовки, которые oauth2-proxy устанавливает при успешной аутентификации
# (используются, когда oauth2-proxy сам проксирует запрос — у нас не этот случай,
# но задаём для полноты).
pass_user_headers   = true

# ------------------------------------------------------------------------------
# Scope
# ------------------------------------------------------------------------------
# Scope: openid (обязательно) + profile + email + groups
# groups — для проброса членства в LDAP-группах через Keycloak
scope               = "openid profile email groups"

# Проверка дополнительных audience в ID-токене (не требуется)
oidc_extra_audiences = []

# ------------------------------------------------------------------------------
# Upstream
# ------------------------------------------------------------------------------
# oauth2-proxy не проксирует запросы — nginx сам направляет их на
# gateway / langfuse / keycloak. "static://200" означает:
# всегда возвращать 200 после успешной аутентификации.
upstreams           = ["static://200"]

# ------------------------------------------------------------------------------
# Страницы входа/выхода
# ------------------------------------------------------------------------------
# При 401 перенаправление на /oauth2/start, который редиректит в Keycloak
# OAuth v7 uses the built-in /oauth2/start endpoint.
custom_templates_dir = ""

# После входа/выхода — возврат на корень исходного хоста (определяется из запроса)
# Redirect destination is derived from the proxied request host.

# ------------------------------------------------------------------------------
# Логирование
# ------------------------------------------------------------------------------
standard_logging    = true
auth_logging        = true
request_logging     = true

# Уровень логирования: debug | info | warning | error
# В проде — info, при отладке — debug
standard_logging_format = "{{.Message}}"

# Не логировать ping-запросы healthcheck
silence_ping_logging = true

# Формат логов: text | json
# v7 emits structured logs through the standard logging format.

# ------------------------------------------------------------------------------
# Безопасность
# ------------------------------------------------------------------------------
# Принудительный HTTPS (в нашем случае nginx терминирует TLS, поэтому отключено)
force_https         = false

# Skip provider button — сразу редирект в Keycloak без страницы выбора
skip_provider_button = true

# Reverse proxy: доверяем заголовкам X-Forwarded-* от nginx
reverse_proxy       = true

# Whitelist доменов для редиректа после входа (пусто = только домен запроса).
# Это позволяет обслуживать и factory., и langfuse. домены одним инстансом,
# так как домен редиректа определяется из X-Forwarded-Host каждого запроса.
whitelist_domains   = []

# ------------------------------------------------------------------------------
# JWT / OIDC
# ------------------------------------------------------------------------------
# Проверка audience в ID-токене выполняется автоматически (должен совпадать
# с client_id). OIDC discovery включён (используется /realms/factory/.well-known).

# ------------------------------------------------------------------------------
# Healthcheck
# ------------------------------------------------------------------------------
# /ping отвечает 200 без аутентификации — используется в healthcheck docker-compose.
# Дополнительных настроек не требуется.